name: pdf_x
description: "A high-performance, lightweight Flutter application for PDF viewing, Excel parsing, and local ML text recognition."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # --- الترجمة واللغات (Localization) ---
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # --- الواجهات والتصميم ---
  cupertino_icons: ^1.0.8
  flutter_spinkit: ^5.2.1
  google_fonts: ^6.2.1
  mime: ^1.0.6

  # --- إدارة الملفات والتخزين المحلي ---
  path_provider: ^2.1.5
  permission_handler: ^11.3.1
  share_plus: ^10.0.2
  file_selector: ^1.0.3
  open_filex: ^4.5.0
  shared_preferences: ^2.3.2

  # --- محركات المعالجة والـ PDF والملفات ---
  pdf: ^3.11.1
  printing: ^5.13.2
  pdfx: ^2.9.2
  flutter_pdfview: ^1.3.2
  image_picker: ^1.1.2
  excel: ^4.0.6
  in_app_file_view: ^1.1.0
  archive: ^3.6.1

  # --- الذكاء الاصطناعي والـ OCR المحلي (On-Device ML) ---
  google_mlkit_text_recognition: ^0.13.0
  google_mlkit_commons: ^0.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

# --- إعدادات أيقونة التطبيق (App Icon Configuration) ---
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/icon/